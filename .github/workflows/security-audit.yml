
name: Moshi Security Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Analyse des dépendances
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Audit complet des dépendances
        run: npm audit
        continue-on-error: true

      - name: Vérifier strictement les dépendances de production
        run: npm audit --omit=dev
