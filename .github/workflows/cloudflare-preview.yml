
name: Moshi Cloudflare Preview Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Tester les pages Moshi sur Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier TypeScript
        run: npm run typecheck

      - name: Construire et démarrer le Worker
        run: |
          npm run preview > preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT

          READY=false

          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/ || true)

            if [ "$STATUS" = "200" ]; then
              READY=true
              break
            fi

            if ! kill -0 "$PREVIEW_PID" 2>/dev/null; then
              echo "Le serveur Preview s'est arrêté."
              cat preview.log
              exit 1
            fi

            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "Le serveur n'a pas démarré correctement."
            cat preview.log
            exit 1
          fi

          echo "Le Worker Cloudflare est démarré."

          ROUTES=(
            "/"
            "/auth/login"
            "/create"
            "/live"
            "/live/start"
            "/messages"
            "/notifications"
            "/profile/me"
            "/profile/edit"
            "/settings"
            "/shop"
            "/seller"
            "/seller/orders"
            "/wallet"
            "/admin"
          )

          FAILED=0

          for ROUTE in "${ROUTES[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8787${ROUTE}" || true)

            if [[ "$STATUS" =~ ^[23][0-9][0-9]$ ]]; then
              echo "OK $STATUS $ROUTE"
            else
              echo "ERREUR $STATUS $ROUTE"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "Certaines pages présentent des erreurs."
            cat preview.log
            exit 1
          fi

          echo "Toutes les pages testées répondent correctement."
