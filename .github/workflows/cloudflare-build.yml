
name: Moshi Cloudflare Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "open-next.config.ts"
      - "wrangler.toml"
      - "tsconfig.json"
      - ".github/workflows/cloudflare-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Vérification du build Cloudflare
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier TypeScript
        run: npm run typecheck

      - name: Compiler pour Cloudflare
        run: npm run build:cloudflare
